    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .check-btn.tested-ok .material-icons { color: #228B22; }
        .check-btn.tested-broken .material-icons { color: #CC0000; }
        .check-btn.tested-broken { border-color: rgba(204,0,0,0.35); }
    </style>

<body>

    <div class="container" id="game-list-container">
        <div class="sticky-dashboard">
            <div class="title-row">
                <div>
                    <div class="eyebrow">Biblioteca · Xbox 360 · jogos no PC</div>
                    <h1>Minha <span class="h1-accent">Biblioteca</span></h1>
                </div>
                <div class="progress-meta" aria-hidden="true">
                    <span id="progress-text">0 / 0</span>
                    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
            </div>
            <div class="dashboard">
                <div class="stats-grid" id="stats-summary" aria-live="polite"></div>
                <div class="filter-panel" aria-label="Filtros da lista">
                    <label class="filter-field search-field">
                        <span>Buscar</span>
                        <input id="search-query" type="search" placeholder="Nome ou Title ID" onkeydown="handleSearchKey(event)">
                    </label>
                    <label class="filter-field">
                        <span>Ordem</span>
                        <select id="sort-mode">
                            <option value="alpha" selected>A-Z</option>
                            <option value="size-desc">Maior tamanho</option>
                            <option value="size-asc">Menor tamanho</option>
                        </select>
                    </label>
                    <label class="filter-field">
                        <span>Checks</span>
                        <select id="check-filter-mode">
                            <option value="all">Todos marcados</option>
                            <option value="any">Qualquer marcado</option>
                        </select>
                    </label>
                    <div class="filter-checks" id="filter-checks" aria-label="Filtrar por checks"></div>
                    <button class="action-btn apply-filter-btn" onclick="applyListView(event)" title="Aplicar pesquisa e filtros">
                        <span class="material-icons">search</span>
                        <span>Pesquisar</span>
                    </button>
                    <button class="action-btn clear-filter-btn" onclick="clearListFilters(event)" title="Limpar filtros">
                        <span class="material-icons">filter_alt_off</span>
                        <span>Limpar</span>
                    </button>
                </div>
                <div class="toolbar-actions">
                    <button class="action-btn toolbar-btn" id="toggle-listed-filter" onclick="toggleListedFilter(event)" title="Ocultar jogos concluídos">
                        <span class="material-icons">visibility</span>
                        <span>Ocultar concluídos</span>
                    </button>
                    <button class="action-btn toolbar-btn" id="toggle-all-observations" onclick="toggleAllObservations(event)" title="Mostrar todas as observações">
                        <span class="material-icons">unfold_more</span>
                        <span>Mostrar obs</span>
                    </button>
                    <button class="action-btn toolbar-btn" onclick="exportLocalState(event)" title="Exportar progresso local como JSON">
                        <span class="material-icons">download</span>
                        <span>Exportar JSON</span>
                    </button>
                    <span class="sync-status" id="sync-status" title="Estado da sincronização">Local</span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Copiado para a área de transferência!</div>

        function normalizeChecks(checks, obs = '') {
            const normalized = {
                downloading:  !!(checks.downloading ?? checks.downloaded),
                onPc:         !!(checks.onPc ?? checks.installed),
                onHd:         !!checks.onHd,
                tested:       !!checks.tested,

        function migrateLegacyState(state) {
            let changed = false;
            Object.keys(state).forEach(id => {
                const entry = state[id];
                if (entry && entry.listed === true && entry.checks === undefined) {
                    const obs = entry.obs !== undefined ? entry.obs : '';
                    entry.checks = normalizeChecks({
                        downloaded: true, installed: true, tested: true,
                        finished: obs.trim() === ''
                    }, obs);
                    entry.listed = isAllChecked(entry.checks);
                    changed = true;
                } else if (entry && entry.checks) {

                    const normalizedChanged = CHECK_STEPS.some(step => entry.checks[step.key] !== normalized[step.key]);
                    if (normalizedChanged || entry.listed !== isAllChecked(normalized)) {
                        entry.checks = normalized;
                        entry.listed = isAllChecked(normalized);
                        changed = true;
                    }
                }
                if (entry && entry.language !== normalizeLanguage(entry.language)) {
                    entry.language = normalizeLanguage(entry.language);
                    changed = true;
                }

            Object.keys(state).forEach(id => {

                    (!entry.language || entry.language === 'nao') &&
                    (!entry.obs || !String(entry.obs).trim())) {
                    entry.updatedAt = '';
                    changed = true;
                }
            });
            if (changed) writePersistedState(state);
            return state;

                const entry = state[gameId];
                const hasAnyChecks = entry?.checks && Object.values(entry.checks).some(v => v === true);
                const hasObs = !!(entry?.obs && String(entry.obs).trim());
                const hasLang = !!(entry?.language && entry.language !== 'nao');
                if (entry && (hasAnyChecks || hasObs || hasLang)) {
                    entry.libSeeded = true;
                    changed = true;
                    return;
                }
                if (!state[gameId]) state[gameId] = {};
                if (!state[gameId].checks) state[gameId].checks = {};
                state[gameId].checks.downloading = true;
                state[gameId].checks.onPc = true;
                state[gameId].libSeeded = true;
                state[gameId].checks = normalizeChecks(state[gameId].checks, state[gameId].obs || '');
                state[gameId].listed = isAllChecked(state[gameId].checks);
                // Sem timestamp: remoto com qualquer data real pode sobrescrever seeds

                const on = checks[step.key];
                return `
                    <button class="action-btn check-btn ${on ? 'checked' : ''}"
                            onclick="toggleCheck(this, '${gameId}', '${step.key}', event)"
                            title="${step.title}">
                        <span class="material-icons">${on ? 'check_circle' : 'radio_button_unchecked'}</span>
                        <span class="check-label">${step.label}</span>
                    </button>
                `;
            };

            const languageOptionsHtml = LANGUAGE_OPTIONS.map(option => `
                <option value="${option.value}" ${language === option.value ? 'selected' : ''}>${option.label}</option>
            `).join('');

            const hasLang = language !== 'nao' ? 'has-lang' : '';
            const languageHtml = `
                <label class="language-select-container ${hasLang}" title="Idioma">
                    <span class="language-label">Idioma</span>
                    <select class="language-select" onclick="event.stopPropagation()" onchange="saveLanguage('${gameId}', this.value, event)">
                        ${languageOptionsHtml}
                    </select>
                </label>
            `;
            const controlsHtml = [
                ...CHECK_STEPS.filter(step => step.key !== FINAL_CHECK_KEY).map(renderCheckButton),
                languageHtml,
                renderCheckButton(CHECK_STEPS.find(step => step.key === FINAL_CHECK_KEY))
            ].join('');

            const safeName = game.name.replace(/'/g, "\\'");
            const tid = game.titleId || 'sem registro';
            const sizeLabel = game.size ? ` · ${game.size}` : '';
            const formatLabel = game.format ? ` · ${game.format}` : '';

            const html = `
                <div class="game-item ${allDone ? 'listed' : ''}" id="${gameId}" style="--progress:${progress}">
                    <div class="game-header" onclick="toggleGame(this, event)">
                        <div class="game-title-container">
                            <div class="checks-group">${controlsHtml}</div>
                            <span class="game-info">
                                <span class="game-name">${game.name}</span>
                                <span class="title-id"><span class="title-id-key">Title ID</span>${tid}${sizeLabel}${formatLabel}</span>
                            </span>
                        </div>
                        <button class="action-btn copy-btn" onclick="copyName('${safeName}', event)" title="Copiar Nome">
                            <span class="material-icons">content_copy</span>
                        </button>
                    </div>
                    <div class="observations">
                        <textarea placeholder="Adicione suas observações aqui..." oninput="saveText('${gameId}', this.value, this)">${savedObs}</textarea>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            gameViewItems.push({
                gameId,
                name: game.name,
                titleId: game.titleId || '',
                sizeBytes: Number(game.sizeBytes) || 0,
                element: document.getElementById(gameId)
            });
        });

        let summaryItemsLayout = null;
        let summaryValueNodes = null;

        initFilterControls();
        updateHideListedButton();
        updateSummary();
        updateToggleAllButton();
        applyListView(null, { silent: true });

        function toggleGame(element, event) {
            if (event.target.closest('.action-btn')) return;
            const obsDiv = element.nextElementSibling;
            obsDiv.classList.toggle('expanded');
            updateToggleAllButton();
        }

        function toggleAllObservations(event) {
            event.stopPropagation();
            const observations = Array.from(document.querySelectorAll('.observations'));
            const observationsWithText = observations.filter(hasObservationText);
            if (observationsWithText.length === 0) {
                observations.forEach(obs => obs.classList.remove('expanded'));
                updateToggleAllButton();
                showToast("Nenhum jogo com observações.");
                return;
            }
            const shouldExpand = observationsWithText.some(obs => !obs.classList.contains('expanded'));
            observations.forEach(obs => {
                obs.classList.toggle('expanded', shouldExpand && hasObservationText(obs));
            });
            updateToggleAllButton();
        }

        function updateToggleAllButton() {
            const button = document.getElementById('toggle-all-observations');
            const observations = Array.from(document.querySelectorAll('.observations'));
            const observationsWithText = observations.filter(hasObservationText);
            const allExpanded = observationsWithText.length > 0 && observationsWithText.every(obs => obs.classList.contains('expanded'));
            button.title = allExpanded ? 'Colapsar observações preenchidas' : 'Mostrar observações preenchidas';
            button.querySelector('.material-icons').innerText = allExpanded ? 'unfold_less' : 'unfold_more';
            button.querySelector('span:last-child').innerText = allExpanded ? 'Colapsar obs' : 'Mostrar obs';
        }

        function hasObservationText(obsDiv) {
            const textarea = obsDiv.querySelector('textarea');
            return !!textarea && textarea.value.trim() !== '';
        }

        function saveLanguage(gameId, value, event) {
            event.stopPropagation();
            const normalized = normalizeLanguage(value);
            updateState(gameId, 'language', normalized);
            const select = event.target;
            const container = select.closest('.language-select-container');
            if (container) container.classList.toggle('has-lang', normalized !== 'nao');
            updateSummary();
        }

        function toggleCheck(btn, gameId, stepKey, event) {
            event.stopPropagation();
            const gameItem = btn.closest('.game-item');
            const textarea = gameItem.querySelector('textarea');

            let state = readPersistedState();
            if (!state[gameId]) state[gameId] = {};
            if (!state[gameId].checks) state[gameId].checks = {};

            if (stepKey === 'tested') {
                const curTested = !!state[gameId].checks.tested;
                const curBroken = !!state[gameId].checks.tested_broken;
                // ciclo: none → ok → broken → none
                let newTested, newBroken;
                if (!curTested && !curBroken) {
                    newTested = true;  newBroken = false; // none → ok
                } else if (curTested && !curBroken) {
                    newTested = false; newBroken = true;  // ok → broken
                } else {
                    newTested = false; newBroken = false; // broken → none
                }
                state[gameId].checks.tested = newTested;
                state[gameId].checks.tested_broken = newBroken;
                // atualiza visual do botão
                btn.classList.remove('checked', 'tested-ok', 'tested-broken');
                if (newTested && !newBroken) {
                    btn.classList.add('checked', 'tested-ok');
                    btn.querySelector('.material-icons').innerText = 'check_circle';
                    btn.title = 'Testado: OK';
                } else if (newBroken) {
                    btn.classList.add('checked', 'tested-broken');
                    btn.querySelector('.material-icons').innerText = 'cancel';
                    btn.title = 'Testado: Quebrado';
                } else {
                    btn.querySelector('.material-icons').innerText = 'radio_button_unchecked';
                    btn.title = 'Não testado';
                }
            } else {
                const nowOn = !btn.classList.contains('checked');
                if (stepKey === FINAL_CHECK_KEY && nowOn && textarea.value.trim() !== '') {
                    const obsDiv = gameItem.querySelector('.observations');
                    obsDiv.classList.add('expanded');
                    textarea.focus();
                    showToast("Limpe as observações antes de marcar Obs revisada.");
                    return;
                }
                btn.classList.toggle('checked', nowOn);
                btn.querySelector('.material-icons').innerText = nowOn ? 'check_circle' : 'radio_button_unchecked';
                state[gameId].checks[stepKey] = nowOn;
            }
            state[gameId] = normalizeEntry(state[gameId]);
            state[gameId].updatedAt = nowIso();
            const checks = state[gameId].checks;
            const allDone = CHECK_STEPS.every(step => !!checks[step.key]);
            const progress = CHECK_STEPS.reduce((n, step) => n + (checks[step.key] ? 1 : 0), 0) / CHECK_STEPS.length;
            state[gameId].listed = allDone;
            stateData[gameId] = state[gameId];
            gameItem.classList.toggle('listed', allDone);
            gameItem.style.setProperty('--progress', progress);
            writePersistedState(state);
            queueSyncGame(gameId);
            updateSummary();
            applyListView();
        }

        function copyName(name, event) {
            event.stopPropagation();
            navigator.clipboard.writeText(name).then(() => {
                showToast("Copiado: " + name);
            }).catch(err => { console.error('Failed to copy: ', err); });
        }

        function saveText(gameId, text, textarea) {
            updateToggleAllButton();
            const gameItem = textarea.closest('.game-item');
            const finalBtn = gameItem.querySelector(`.check-btn[onclick*="'${FINAL_CHECK_KEY}'"]`);
            let state = readPersistedState();
            if (!state[gameId]) state[gameId] = {};
            if (!state[gameId].checks) state[gameId].checks = {};
            state[gameId].obs = text;
            if (text.trim() !== '' && finalBtn && finalBtn.classList.contains('checked')) {
                finalBtn.classList.remove('checked');
                finalBtn.querySelector('.material-icons').innerText = 'radio_button_unchecked';
                gameItem.classList.remove('listed');
                state[gameId].checks[FINAL_CHECK_KEY] = false;
            }
            state[gameId] = normalizeEntry(state[gameId]);
            state[gameId].updatedAt = nowIso();
            const checks = state[gameId].checks;
            const progress = CHECK_STEPS.reduce((n, step) => n + (checks[step.key] ? 1 : 0), 0) / CHECK_STEPS.length;
            gameItem.style.setProperty('--progress', progress);
            gameItem.classList.toggle('listed', state[gameId].listed);
            stateData[gameId] = state[gameId];
            writePersistedState(state);
            queueTextSyncGame(gameId);
            scheduleSummaryUpdate();
        }

        function getCurrentState() {
            return readPersistedState();
        }

        function getCurrentChecks(gameId) {
            const state = getCurrentState();
            const entry = state[gameId] || {};
            const textarea = document.querySelector(`#${gameId} textarea`);
            const obs = entry.obs !== undefined ? entry.obs : (textarea ? textarea.value : '');
            return normalizeChecks(entry.checks || {}, obs);
        }

        function buildSummaryLayout() {
            const stats = CHECK_STEPS.map(step => ({ key: step.key, label: step.label }));
            const items = [
                { label: 'Jogos na lista', kind: 'primary' },
                ...stats.map(stat => ({ label: stat.label, statKey: stat.key })),
                { label: 'Quebrados', brokenKey: true },
                { label: 'Legendado', langKey: 'legendado' },
                { label: 'Dublado', langKey: 'dublado' },
                { label: 'Concluídos', kind: 'success', completed: true }
            ];
            const target = document.getElementById('stats-summary');
            target.innerHTML = items.map(item => {
                const cls = item.kind === 'primary' ? 'is-primary' : item.kind === 'success' ? 'is-success' : '';
                return `
                    <div class="stat-card ${cls}">
                        <span class="stat-value">0</span>
                        <span class="stat-label" title="${item.label}">${item.label}</span>
                    </div>
                `;
            }).join('');
            summaryItemsLayout = items;
            summaryValueNodes = Array.from(target.querySelectorAll('.stat-value'));
        }

        function updateSummary() {
            if (!summaryItemsLayout) buildSummaryLayout();

            const state = readPersistedState();
            const counts = {};
            CHECK_STEPS.forEach(step => { counts[step.key] = 0; });
            const languageStats = { legendado: 0, dublado: 0 };
            let completed = 0;
            let broken = 0;

            for (let i = 0; i < gamesData.length; i++) {
                const gameId = gameIdFor(gamesData[i]);
                const entry = state[gameId] || {};
                const obs = entry.obs !== undefined ? entry.obs : (gamesData[i].obs || '');
                const checks = normalizeChecks(entry.checks || {}, obs);
                for (let j = 0; j < CHECK_STEPS.length; j++) {
                    if (checks[CHECK_STEPS[j].key]) counts[CHECK_STEPS[j].key] += 1;
                }
                if (checks.tested_broken) broken += 1;
                const language = normalizeLanguage(entry.language);
                if (languageStats[language] !== undefined) languageStats[language] += 1;
                if (isAllChecked(checks)) completed += 1;
            }

            for (let i = 0; i < summaryItemsLayout.length; i++) {
                const item = summaryItemsLayout[i];
                let value;
                if (item.kind === 'primary') value = gamesData.length;
                else if (item.completed) value = completed;
                else if (item.brokenKey) value = broken;
                else if (item.statKey) value = counts[item.statKey];
                else if (item.langKey) value = languageStats[item.langKey];
                else value = 0;
                const node = summaryValueNodes[i];
                const str = String(value);
                if (node.textContent !== str) node.textContent = str;
            }

            const total = gamesData.length;
            const pct = total === 0 ? 0 : (completed / total) * 100;
            const fill = document.getElementById('progress-fill');
            const fillStr = pct + '%';
            if (fill.style.width !== fillStr) fill.style.width = fillStr;
            const progText = document.getElementById('progress-text');
            const txt = `${completed} / ${total} concluídos`;
            if (progText.textContent !== txt) progText.textContent = txt;
            if (gameViewItems.length) updateFilterSummary(document.querySelectorAll('.game-item:not([hidden])').length);
        }

        let summaryDebounceId = null;
        function scheduleSummaryUpdate() {
            if (summaryDebounceId !== null) return;
            summaryDebounceId = setTimeout(() => {
                summaryDebounceId = null;
                updateSummary();
            }, 220);
        }

        function updateState(gameId, key, value) {
            let state = readPersistedState();
            if (!state[gameId]) state[gameId] = {};
            state[gameId][key] = value;
            state[gameId] = normalizeEntry(state[gameId]);
            state[gameId].updatedAt = nowIso();
            stateData[gameId] = state[gameId];
            writePersistedState(state);
            queueSyncGame(gameId);
        }

        function queueSyncGame(gameId) {
            if (applyingRemoteState || !syncReady || !syncClient) return;
            clearTimeout(syncTimers.get(gameId));
            syncTimers.set(gameId, setTimeout(() => {
                syncTimers.delete(gameId);
                syncGameToRemote(gameId);
            }, 650));
        }

        function queueTextSyncGame(gameId) {
            clearTimeout(textSyncTimers.get(gameId));
            textSyncTimers.set(gameId, setTimeout(() => {
                textSyncTimers.delete(gameId);
                queueSyncGame(gameId);
            }, 900));
        }

        async function syncGameToRemote(gameId) {
            if (!syncReady || !syncClient) return;
            const state = readPersistedState();
            const data = normalizeEntry(state[gameId] || {});
            if (!data.updatedAt) data.updatedAt = nowIso();
            const { error } = await syncClient
                .from(SYNC_CONFIG.tableName)
                .upsert({
                    list_id: SYNC_CONFIG.listId,
                    game_id: gameId,
                    data,
                    updated_at: data.updatedAt
                }, { onConflict: 'list_id,game_id' });
            if (error) {
                console.error('Falha ao sincronizar jogo:', error);
                setSyncStatus('Sync pendente', 'warning');
                return;
            }
            setSyncStatus('Sincronizado', 'online');
        }

        async function syncAllLocalState(remoteTimes = new Map()) {
            if (!syncReady || !syncClient) return;
            const state = readPersistedState();
            const rows = Object.entries(state)
                .map(([gameId, entry]) => {
                    const data = normalizeEntry(entry);
                    if (!data.updatedAt) data.updatedAt = nowIso();
                    return { gameId, data };
                })
                .filter(({ gameId, data }) => getEntryTime(data) > (remoteTimes.get(gameId) || 0))
                .map(({ gameId, data }) => ({
                    list_id: SYNC_CONFIG.listId,
                    game_id: gameId,
                    data,
                    updated_at: data.updatedAt
                }));
            if (rows.length === 0) return;
            const { error } = await syncClient
                .from(SYNC_CONFIG.tableName)
                .upsert(rows, { onConflict: 'list_id,game_id' });
            if (error) {
                console.error('Falha ao enviar progresso local:', error);
                setSyncStatus('Sync pendente', 'warning');
            }
        }

        async function pullRemoteState() {
            const { data, error } = await syncClient
                .from(SYNC_CONFIG.tableName)
                .select('game_id,data,updated_at')
                .eq('list_id', SYNC_CONFIG.listId);
            if (error) throw error;
            const remoteTimes = new Map();
            data.forEach(row => {
                remoteTimes.set(row.game_id, getEntryTime(row.data, row.updated_at));
                applyRemoteRow(row);
            });
            return remoteTimes;
        }

        async function pollRemoteState() {
            if (!syncReady || !syncClient || applyingRemoteState) return;
            try {
                await pullRemoteState();
                if (document.getElementById('sync-status')?.dataset.mode !== 'online') {
                    setSyncStatus('Sync ativo', 'online');
                }
            } catch (err) {
                console.error('Falha ao atualizar sincronização:', err);
                setSyncStatus('Sync pendente', 'warning');
            }
        }

        function startSyncPolling() {
            if (syncPollInterval) return;
            syncPollInterval = setInterval(pollRemoteState, 4000);
        }

        function applyRemoteRow(row) {
            const gameId = row.game_id;
            const remoteEntry = normalizeEntry(row.data || {});
            remoteEntry.updatedAt = remoteEntry.updatedAt || row.updated_at || nowIso();
            const state = readPersistedState();
            const localEntry = state[gameId] || {};
            if (getEntryTime(remoteEntry, row.updated_at) < getEntryTime(localEntry)) return;
            applyingRemoteState = true;
            state[gameId] = remoteEntry;
            stateData[gameId] = remoteEntry;
            writePersistedState(state);
            applyEntryToDom(gameId, remoteEntry);
            applyingRemoteState = false;
        }

        function applyEntryToDom(gameId, entry) {
            const gameItem = document.getElementById(gameId);
            if (!gameItem) return;
            const checks = normalizeChecks(entry.checks || {}, entry.obs || '');
            CHECK_STEPS.forEach(step => {
                const btn = gameItem.querySelector(`.check-btn[onclick*="'${step.key}'"]`);
                if (!btn) return;
                if (step.key === 'tested') {
                    const broken = !!checks.tested_broken;
                    const ok = !!checks.tested && !broken;
                    btn.classList.remove('checked', 'tested-ok', 'tested-broken');
                    const icon = btn.querySelector('.material-icons');
                    if (broken) {
                        btn.classList.add('checked', 'tested-broken');
                        if (icon) icon.innerText = 'cancel';
                        btn.title = 'Testado: Quebrado';
                    } else if (ok) {
                        btn.classList.add('checked', 'tested-ok');
                        if (icon) icon.innerText = 'check_circle';
                        btn.title = 'Testado: OK';
                    } else {
                        if (icon) icon.innerText = 'radio_button_unchecked';
                        btn.title = 'Não testado';
                    }
                    return;
                }
                const on = !!checks[step.key];
                btn.classList.toggle('checked', on);
                const icon = btn.querySelector('.material-icons');
                if (icon) icon.innerText = on ? 'check_circle' : 'radio_button_unchecked';
            });
            const select = gameItem.querySelector('.language-select');
            if (select) {
                select.value = normalizeLanguage(entry.language);
                const wrapper = select.closest('.language-select-container');
                if (wrapper) wrapper.classList.toggle('has-lang', select.value !== 'nao');
            }
            const textarea = gameItem.querySelector('textarea');
            if (textarea && document.activeElement !== textarea && textarea.value !== (entry.obs || '')) {
                textarea.value = entry.obs || '';
            }
            const progress = checkedCount(checks) / CHECK_STEPS.length;
            gameItem.classList.toggle('listed', isAllChecked(checks));
            gameItem.style.setProperty('--progress', progress);
            updateSummary();
            updateToggleAllButton();
            if (currentViewApplied && !applyingRemoteState) applyListView();
        }

        async function initRealtimeSync() {
            if (!isSyncConfigured()) {
                setSyncStatus('Local', 'local');
                return;
            }
            if (!window.supabase?.createClient) {
                setSyncStatus('Sync indisponível', 'warning');
                return;
            }
            try {
                setSyncStatus('Conectando', 'warning');
                syncClient = window.supabase.createClient(SYNC_CONFIG.supabaseUrl, SYNC_CONFIG.supabaseAnonKey);
                syncReady = true;
                const remoteTimes = await pullRemoteState();
                await syncAllLocalState(remoteTimes);
                setSyncStatus('Sync ativo', 'online');
                startSyncPolling();
                syncClient
                    .channel(`top300:${SYNC_CONFIG.listId}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: SYNC_CONFIG.tableName,
                        filter: `list_id=eq.${SYNC_CONFIG.listId}`
                    }, payload => {
                        if (payload.new) applyRemoteRow(payload.new);
                    })
                    .subscribe(status => {
                        if (status === 'SUBSCRIBED') setSyncStatus('Tempo real', 'online');
                        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                            setSyncStatus('Sync ativo', 'online');
                        }
                    });
            } catch (err) {
                console.error('Falha ao iniciar sincronização:', err);
                setSyncStatus('Sync pendente', 'warning');
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        initRealtimeSync();
    </script>
</body>
</html>
